<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesava DevOps Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1d2671, #c33764);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
        }

        .box {
            display: inline-block;
            padding: 25px 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .footer {
            margin-top: 100px;
            font-size: 16px;
            opacity: 0.8;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: #c33764;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #f1f1f1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            <h1>🚀 DevOps CI/CD Demo</h1>
            <p>Successfully deployed using Jenkins + Docker + GitHub Webhook</p>
            <a href="#" class="button">Deployment Successful</a>
        </div>
    </div>

    <div class="footer">
        Created by Kesava | AWS EC2 + Jenkins Pipeline Project
    </div>

</body>
</html>
