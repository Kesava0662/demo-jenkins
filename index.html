<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesava DevOps Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
        }

        .box {
            background: rgba(255,255,255,0.15);
            padding: 25px;
            width: 60%;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        .footer {
            margin-top: 50px;
            font-size: 16px;
            color: #ddd;
        }

        .btn {
            background: #ff9800;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .btn:hover {
            background: #e68900;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>🚀 DevOps CI/CD Demo</h1>
            <p>Successfully deployed using Jenkins + Docker + GitHub Webhook</p>
            <a href="#" class="btn">Deployment Success</a>
        </div>

        <div class="footer">
            <p>Created by Kesava | AWS EC2 Project</p>
        </div>
    </div>
</body>
</html>
